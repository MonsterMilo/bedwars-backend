name: Deploy backend to Render

# Render's auto-deploy-on-push doesn't fire for this repo (its GitHub
# integration isn't authorized for it), so trigger a deploy directly via
# Render's Deploy Hook instead of relying on that. Requires a repo secret
# named RENDER_DEPLOY_HOOK_URL (Render dashboard -> this service ->
# Settings -> Deploy Hook).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
